<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Practice your first Persian greeting.">
  <title>Greetings | Mehmooni</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container conversation-page">
    <a class="back-link" href="index.html">← All conversation types</a>
    <header class="conversation-header">
      <h1>Greetings</h1>
      <p>Say hello and ask a friend how they are doing.</p>
    </header>

    <article class="greeting-card">
      <h2>Your first greeting</h2>
      <div class="greeting-copy">
        <p class="persian-text"><bdi lang="fa" dir="rtl">سلام، خوبی؟</bdi></p>
        <div class="greeting-reveals">
          <details class="greeting-reveal">
            <summary>Pronunciation</summary>
            <p lang="fa-Latn">Salâm, khubi?</p>
          </details>
          <details class="greeting-reveal">
            <summary>Translation</summary>
            <p>Hi, how are you?</p>
          </details>
        </div>
      </div>
      <div class="greeting-audio">
        <h3>Listen to the greeting</h3>
        <audio controls preload="none">
          <source src="assets/audio/greeting-01.mp3" type="audio/mpeg">
          Your browser does not support audio playback.
        </audio>
      </div>
    </article>
  </main>
  <footer class="site-footer">
    <p>Mehmooni. Made for real conversations.</p>
  </footer>
</body>
</html>
